services:
  handtech-website:
    build:
      context: https://github.com/handaruadit/lp-handtech-website.git#main
      dockerfile: Dockerfile
    container_name: lp-handtech-website
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0