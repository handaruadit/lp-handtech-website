services:
  handtech-website:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: lp-handtech-website
    restart: unless-stopped

    ports:
      - "127.0.0.1:3004:3000"

    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"

networks:
  default:
    name: handtech_default